name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo +1.97.1 fmt --manifest-path rust-client/Cargo.toml --all -- --check
      - run: cargo +1.97.1 clippy --manifest-path rust-client/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.97.1 test --manifest-path rust-client/Cargo.toml --all-targets --locked

  rust-server:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo +1.97.1 fmt --manifest-path rust-server/Cargo.toml --all -- --check
      - run: cargo +1.97.1 clippy --manifest-path rust-server/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.97.1 test --manifest-path rust-server/Cargo.toml --all-targets --locked
      - run: bash scripts/test_tunnel_subnet.sh
      - run: python3 scripts/test_release_safety.py

  openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y nftables iptables iproute2 busybox shellcheck
      - run: shellcheck openwrt/files/usr/libexec/csqtt-tun
      # В CI root нужен только для создания изолированного network namespace.
      - run: sudo python3 scripts/test_openwrt_firewall.py --require-netns

  rust-server-cross:
    # Статические musl-бинарники для ARM VPS; amd64 собирается тем же скриптом при релизе.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, armv7]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo install cargo-zigbuild --locked
      - run: bash rust-server/build_linux.sh --arch ${{ matrix.arch }} --tests
      - run: file rust-server/dist/csqtt-linux-${{ matrix.arch }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0"
      - run: bash gradlew testDebugUnitTest lintDebug --no-daemon --console=plain
